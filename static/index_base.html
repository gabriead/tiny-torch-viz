<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TinyTorch Visualizer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e27; color: #e2e8f0; }
    #app { display: flex; height: 100vh; overflow: hidden; }
    #canvas { flex: 1 1 auto; min-width: 320px; position: relative; overflow: auto; background: linear-gradient(#1a1f3a 1px, transparent 1px), linear-gradient(90deg, #1a1f3a 1px, transparent 1px); background-size: 30px 30px; padding: 40px; }
    #canvas-content { position: relative; transform-origin: 0 0; min-width: 4000px; min-height: 2400px; padding-top: 72px; }
    .v-resizer { width: 6px; min-width: 6px; flex-shrink: 0; background: #1e293b; cursor: col-resize; z-index: 100; transition: background 0.2s; }
    .v-resizer:hover { background: #3b82f6; }
    #editor { flex: 0 0 460px; min-width: 340px; background: #0f1419; border-left: 2px solid #1e293b; display: flex; flex-direction: column; padding: 20px; gap: 12px; }
    #editor h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status-indicator.disconnected { background: #ef4444; }
    .status-indicator.connecting { background: #f59e0b; }
    #code { flex: 1; background: #1a1f3a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.5; resize: none; }
    #run { padding: 10px 24px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #run:hover { background: #2563eb; }
    #run:disabled { background: #475569; cursor: not-allowed; }
    #error { color: #ef4444; font-size: 12px; min-height: 20px; font-family: monospace; white-space: pre-wrap; }
    #console-container { margin-top: 12px; border: 1px solid #334155; border-radius: 6px; background: #0a0f1a; overflow: hidden; display: flex; flex-direction: column; min-height: 60px; height: 150px; flex-shrink: 0; }
    #console-resizer { height: 6px; background: transparent; cursor: ns-resize; position: relative; flex-shrink: 0; }
    #console-resizer::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 3px; background: #475569; border-radius: 2px; transition: background 0.2s; }
    #console-resizer:hover::after { background: #64748b; }
    #console-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #1e293b; border-bottom: 1px solid #334155; font-size: 11px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px; }
    #console-clear { background: none; border: none; color: #64748b; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 3px; }
    #console-clear:hover { background: #334155; color: #f1f5f9; }
    #console-output { flex: 1; overflow-y: auto; padding: 8px 10px; font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 12px; line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; }
    #console-output .console-line { margin: 2px 0; }
    #console-output .console-line.error { color: #f87171; }
    #console-output .console-line.success { color: #4ade80; }
    #console-output .console-line.info { color: #60a5fa; }
    #pdfSidebar { flex: 1 1 340px; min-width: 260px; background: #020617; border-left: 2px solid #1e293b; display: flex; flex-direction: column; }
    #pdfSidebarHeader { padding: 8px 10px; border-bottom: 1px solid #1f2937; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pdf-title { font-size: 11px; text-transform: uppercase; color: #9ca3af; }
    .pdf-file-btn { position: relative; border-radius: 999px; background: #111827; color: #e5e7eb; font-size: 11px; padding: 5px 10px; cursor: pointer; }
    .pdf-file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .pdf-controls, .pdf-zoom { display: inline-flex; align-items: center; gap: 4px; }
    .pdf-controls { margin-left: auto; }
    .pdf-btn { border: none; border-radius: 999px; background: #020617; color: #e5e7eb; padding: 3px 7px; font-size: 11px; cursor: pointer; border: 1px solid #1f2937; }
    #pdfPageInfo, #pdfZoomValue { font-size: 11px; color: #9ca3af; min-width: 52px; text-align: center; }
    #pdfViewerWrapper { flex: 1; overflow: auto; padding: 8px 10px 16px 10px; }
    #pdfCanvas { display: none; background: #020617; border-radius: 8px; }
    #pdfPlaceholder { font-size: 11px; color: #6b7280; padding: 10px; text-align: center; }

    .group-container { position: absolute; z-index: 2; }
    .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: #64748b; margin-bottom: 8px; font-weight: 600; cursor: grab; user-select: none; white-space: nowrap; }
    .group-label:active { cursor: grabbing; }
    .group-selected { box-shadow: 0 0 0 2px #3b82f6; border-radius: 8px; }

    .matrix-card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: inline-block; min-width: 100px; }
    .matrix-card.is-batched { box-shadow: 4px 4px 0 #1a1f3a, 5px 5px 0 #3b82f6, 9px 9px 0 #1a1f3a, 10px 10px 0 #2563eb; border-right: 1px solid #3b82f6; border-bottom: 1px solid #3b82f6; margin-right: 10px; margin-bottom: 10px; }
    .batch-badge { font-size: 0.7em; background: #2563eb; color: white; padding: 1px 4px; border-radius: 3px; margin-left: 8px; vertical-align: middle; text-transform: uppercase; letter-spacing: 0.5px; }

    .matrix-title { font-size: 11px; font-weight: 700; color: #3b82f6; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .matrix-shape { color: #64748b; font-weight: 500; }
    .matrix-table { border-collapse: collapse; font-size: 13px; }
    .matrix-table td { border: 1px solid #334155; padding: 6px 8px; text-align: right; background: #0f1419; min-width: 50px; transition: background-color 0.15s ease, box-shadow 0.15s ease; }
    .matrix-table td.highlight-row { background: rgba(59, 130, 246, 0.3); box-shadow: inset 0 0 0 1px #3b82f6; }
    .matrix-table td.highlight-col { background: rgba(16, 185, 129, 0.3); box-shadow: inset 0 0 0 1px #10b981; }
    .matrix-table td.highlight-cell { background: rgba(251, 191, 36, 0.4); box-shadow: inset 0 0 0 2px #fbbf24; }

    .layout-grid { display: inline-grid; gap: 8px; }
    .layout-binary { grid-template-columns: auto auto; grid-template-rows: auto auto; }
    .layout-unary { grid-template-columns: auto; }
    .pos-left { grid-row: 2; grid-column: 1; align-self: start; }
    .pos-top { grid-row: 1; grid-column: 2; align-self: end; }
    .pos-result { grid-row: 2; grid-column: 2; align-self: start; }

    .layout-elementwise { display: inline-grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; gap: 10px; align-items: center; }
    .elem-left { grid-row: 1; grid-column: 1; }
    .elem-op { grid-row: 1; grid-column: 2; align-self: center; justify-self: center; }
    .elem-right { grid-row: 1; grid-column: 3; }
    .elem-result { grid-row: 2; grid-column: 1; }
    .op-symbol-large { font-size: 28px; font-weight: 300; color: #64748b; padding: 0 8px; user-select: none; }

    .layout-linear { display: inline-grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 8px; }
    .linear-empty { grid-row: 1; grid-column: 1; }
    .linear-top { grid-row: 1; grid-column: 2; align-self: end; }
    .linear-left { grid-row: 2; grid-column: 1; align-self: start; }
    .linear-result { grid-row: 2; grid-column: 2; align-self: start; }
    .layout-loss { display: inline-flex; gap: 8px; align-items: flex-start; }
    .loss-result { margin-left: 8px; border-color: #ef4444; }

    #toolbar { position: sticky; top: 0; left: 0; z-index: 100; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; border-radius: 999px; background: rgba(15,23,42,0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .tool-btn { border: none; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #111827; color: #e5e7eb; }
    .tool-btn:hover { background: #1f2937; }
    .tool-btn.active { background: #3b82f6; color: white; }
    .tool-group { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding-left: 8px; border-left: 1px solid #1f2937; }
    .tool-label { font-size: 11px; text-transform: uppercase; color: #9ca3af; }
    .tool-select { background: #020617; color: #e5e7eb; border-radius: 999px; border: 1px solid #1f2937; padding: 3px 8px; font-size: 11px; }
    .tool-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; }

    .layer-box { position: absolute; border-radius: 12px; border: 2px solid; z-index: 1; }
    .layer-box-label { position: absolute; top: 6px; left: 12px; right: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; cursor: grab; user-select: none; }
    .layer-box-label:active { cursor: grabbing; }
    .layer-box-selected { box-shadow: 0 0 0 2px #f97316; }

    .note-container { position: absolute; max-width: 300px; background: rgba(15,23,42,0.97); border-radius: 8px; border: 1px solid #38bdf8; padding: 8px 10px; font-size: 12px; z-index: 4; cursor: grab; }
    .note-header { font-size: 10px; text-transform: uppercase; color: #7dd3fc; margin-bottom: 4px; cursor: grab; }
    .note-body { font-size: 12px; line-height: 1.45; color: #e5e7eb; }
    .note-modal-backdrop { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
    .note-modal-backdrop.show { display: flex; }
    .note-modal { width: min(640px, 90vw); background: #020617; border-radius: 12px; padding: 20px; }
    .note-modal-title { font-size: 14px; font-weight: 600; color: #e5e7eb; margin-bottom: 12px; }
    #note-modal-textarea { width: 100%; min-height: 200px; border-radius: 8px; border: 1px solid #1f2937; background: #0f1419; color: #e5e7eb; padding: 12px; font-family: monospace; font-size: 13px; margin-bottom: 12px; }
    .note-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .note-modal-btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    #note-modal-cancel { background: #374151; color: #e5e7eb; }
    #note-modal-delete { background: #dc2626; color: white; }
    #note-modal-save { background: #3b82f6; color: white; }

    /* RETRO MODE */
    body.retro-mode { background-color: #050505; background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.02), rgba(0,0,255,0.03)); background-size: 100% 2px, 3px 100%; }
    body.retro-mode #canvas { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%), linear-gradient(#0a0f0a 1px, transparent 1px), linear-gradient(90deg, #0a0f0a 1px, transparent 1px); background-size: 100% 2px, 30px 30px, 30px 30px; }
    body.retro-mode #editor, body.retro-mode #toolbar, body.retro-mode .matrix-card { background: rgba(15, 15, 20, 0.65); backdrop-filter: blur(12px); border-color: rgba(255, 255, 255, 0.08); }
    body.retro-mode .group-container { background: rgba(10, 15, 10, 0.5); border: 1px solid rgba(0, 255, 65, 0.15); box-shadow: 0 0 20px rgba(0, 255, 65, 0.05); }
    body.retro-mode .matrix-table td { color: #00ff41; border-color: rgba(0, 255, 65, 0.2); }
    body.retro-mode .group-label { color: #00f3ff; text-shadow: 0 0 4px rgba(0, 243, 255, 0.4); }
  </style>
</head>
<body>
<div id="app">
  <div id="canvas"></div>
  <div class="v-resizer" data-left="canvas"></div>
  <div id="editor">
    <h2><span class="status-indicator" id="wsStatus"></span> TINYTORCH PYTHON CODE</h2>
    <textarea id="code" spellcheck="false">
# Code loads here
</textarea>
    <button id="run">Run</button>
    <div id="console-resizer"></div>
    <div id="console-container">
      <div id="console-header">
        <span>CONSOLE OUTPUT</span>
        <button id="console-clear">✕</button>
      </div>
      <div id="console-output"></div>
    </div>
    <div id="error"></div>
  </div>
  <div class="v-resizer" data-left="editor"></div>
  <div id="pdfSidebar">
    <div id="pdfSidebarHeader">
      <span class="pdf-title">PDF REF</span>
      <label class="pdf-file-btn">Load PDF<input type="file" id="pdfFileInput" accept="application/pdf"></label>
      <div class="pdf-controls">
        <button id="pdfPrev" class="pdf-btn">◀</button>
        <span id="pdfPageInfo">- / -</span>
        <button id="pdfNext" class="pdf-btn">▶</button>
      </div>
      <div class="pdf-zoom">
        <button id="pdfZoomOut" class="pdf-btn">-</button>
        <span id="pdfZoomValue">100%</span>
        <button id="pdfZoomIn" class="pdf-btn">+</button>
      </div>
    </div>
    <div id="pdfViewerWrapper">
      <canvas id="pdfCanvas"></canvas>
      <div id="pdfPlaceholder">Load a PDF to view it here.</div>
    </div>
  </div>
</div>
<input type="file" id="jsonFileInput" accept="application/json" style="display:none">

<div id="note-modal-backdrop" class="note-modal-backdrop">
  <div class="note-modal">
    <div class="note-modal-title">Edit Note</div>
    <textarea id="note-modal-textarea"></textarea>
    <div class="note-modal-actions">
      <button id="note-modal-cancel" class="note-modal-btn">Cancel</button>
      <button id="note-modal-delete" class="note-modal-btn">Delete</button>
      <button id="note-modal-save" class="note-modal-btn">Save</button>
    </div>
  </div>
</div>

<script>
  // Global State
  var tensors = {};
  var groups = [];
  var pendingBoxes = [];
  var boxes = [];
  var canvasNotes = [];
  var skipLayout = false;
  var currentTool = 'select';
  var showMatrixData = true;
  var zoomLevel = 1;
  var nextGroupId = 1;
  var nextBoxId = 1;
  var selectedGroupIds = new Set();
  var selectedBoxIds = new Set();
  var ws = null;
  var wsConnected = false;

  // ==================== Tensor to 2D (FIXED) ====================
  function tensorTo2D(t, orientation) {
    orientation = orientation || 'auto';
    if (!t || !t.data) return { mat: [[]], shape: [] };

    var data = JSON.parse(JSON.stringify(t.data));
    var shape = t.shape ? t.shape.slice() : [];

    // 1. GLOBAL SQUEEZE (Recursive)
    function squeeze(arr, currentDims) {
        if (currentDims.length === 0) return arr;
        if (currentDims[0] === 1) {
            return squeeze(arr[0], currentDims.slice(1));
        } else {
            if (!Array.isArray(arr)) return arr;
            var result = [];
            for (var i = 0; i < arr.length; i++) {
                result.push(squeeze(arr[i], currentDims.slice(1)));
            }
            return result;
        }
    }

    // Check if we need to squeeze 1s (like (1, 4, 2, 1))
    var hasOne = false;
    for (var i = 0; i < shape.length; i++) { if (shape[i] === 1) hasOne = true; }

    if (hasOne) {
        data = squeeze(data, shape);
        var newShape = [];
        for (var i = 0; i < shape.length; i++) { if (shape[i] !== 1) newShape.push(shape[i]); }
        shape = newShape;
    }

    // 2. SLICE BATCHES (Show Batch 0)
    // If shape is still > 2D (e.g. 32, 4, 2), slice it down.
    while (shape.length > 2) {
        if (Array.isArray(data) && data.length > 0) {
            data = data[0];
        } else {
            data = [];
        }
        shape.shift();
    }

    // 3. FORMAT TO GRID
    var rows = 1, cols = 1;
    var grid = [];

    if (shape.length === 0) {
        // Scalar
        grid = [[data]];
    } else if (shape.length === 1) {
        // Vector
        if (orientation === 'row') {
            rows = 1; cols = shape[0];
            grid = [data];
        } else {
            rows = shape[0]; cols = 1;
            grid = [];
            for(var i=0; i<data.length; i++) grid.push([data[i]]);
        }
    } else {
        // Matrix
        rows = shape[0]; cols = shape[1];
        grid = data;
    }

    // 4. STRINGIFY
    var mat = [];
    for (var r = 0; r < rows; r++) {
      var rowArr = [];
      var rowData = grid[r] || [];
      for (var c = 0; c < cols; c++) {
        var v = rowData[c];
        var vStr = (typeof v === 'number' && isFinite(v)) ? v.toFixed(4) : String(v !== null && v !== undefined ? v : '');
        rowArr.push(vStr);
      }
      mat.push(rowArr);
    }
    return { mat: mat, shape: shape };
  }

  // ==================== Create Matrix Card ====================
  function createMatrixCard(label, tensor, orientation, role) {
    orientation = orientation || 'auto';
    var result = tensorTo2D(tensor, orientation);
    var mat = result.mat;
    var displayShape = result.shape;

    // Check original rank for Stack Effect (Batch indicator)
    var originalRank = tensor && tensor.shape ? tensor.shape.length : 0;
    var isBatched = originalRank > 2;

    var shapeStr = displayShape.join('×');
    var card = document.createElement('div');
    card.className = 'matrix-card' + (isBatched ? ' is-batched' : '');

    if (role) card.dataset.role = role;
    if (tensor && tensor.id) card.dataset.tensorId = String(tensor.id);

    var titleHtml = '<span>' + label + '</span>';
    titleHtml += '<span class="matrix-shape">' + shapeStr + '</span>';
    if (isBatched) {
        titleHtml += '<span class="batch-badge" title="Showing Batch 0">Batch 0</span>';
    }

    card.innerHTML = '<div class="matrix-title">' + titleHtml + '</div>';

    if (showMatrixData && mat.length > 0 && mat[0].length > 0) {
      var table = document.createElement('table');
      table.className = 'matrix-table';

      var MAX_ROWS = 20, MAX_COLS = 20;
      var totalR = mat.length, totalC = mat[0].length;
      var showR = totalR < MAX_ROWS ? totalR : MAX_ROWS;
      var showC = totalC < MAX_COLS ? totalC : MAX_COLS;

      for (var r = 0; r < showR; r++) {
        var tr = document.createElement('tr');
        tr.dataset.row = r;
        for (var c = 0; c < showC; c++) {
          var td = document.createElement('td');
          td.textContent = mat[r][c];
          td.dataset.row = r;
          td.dataset.col = c;
          tr.appendChild(td);
        }
        if (totalC > MAX_COLS) {
             var ell = document.createElement('td'); ell.textContent = '…'; tr.appendChild(ell);
        }
        table.appendChild(tr);
      }
      if (totalR > MAX_ROWS) {
        var tr = document.createElement('tr');
        var td = document.createElement('td'); td.textContent = '⋮'; tr.appendChild(td);
        table.appendChild(tr);
      }
      card.appendChild(table);
    }
    return card;
  }

  // ==================== Render Op (Safe) ====================
  function renderOp(container, op) {
    var type = op.type;
    var inputs = op.inputs;
    var output = op.output;
    var meta = op.meta;

    function getName(t, fallback) {
      fallback = fallback || '?';
      if (!t) return fallback;
      return t.name || t.id || fallback;
    }

    var safeInputs = inputs || [];
    var safeOutput = output || { id: '?', name: type, shape: [], data: [] };

    var isElementwise = ['add', 'sub', 'mul', 'div'].indexOf(type) !== -1 && safeInputs.length >= 2;
    var isMatmul = type === 'matmul' && safeInputs.length >= 2;
    var isLoss = ['mseloss', 'crossentropyloss', 'bceloss'].indexOf(type) !== -1 && safeInputs.length >= 2;
    var isLinear = type === 'linear' && safeInputs.length >= 2 && meta && meta.has_weight;

    var outputOrientation = 'auto';
    var reductions = ['sum', 'mean', 'max', 'var', 'std'];

    if (reductions.indexOf(type) !== -1) {
        var axis = undefined;
        if (meta) {
            if (meta.axis !== undefined) axis = meta.axis;
            else if (meta.dim !== undefined) axis = meta.dim;
            else if (meta.arg0 !== undefined) axis = meta.arg0;
        }
        if (axis === 0) outputOrientation = 'row';
        else if (axis === 1 || axis === -1) outputOrientation = 'col';
    }

    if (!isElementwise && !isMatmul && !isLoss && !isLinear) {
        var grid = document.createElement('div');
        grid.className = 'layout-grid layout-unary';

        var getInputDisplayName = function(tensor) {
            if (!tensor) return '?';
            if (tensor.name) return tensor.name;
            var producerGroup = null;
            for(var i=0; i<groups.length; i++) {
                if (groups[i].outputId === tensor.id) { producerGroup = groups[i]; break; }
            }
            if (producerGroup) {
                var outId = producerGroup.outputId;
                var producerOutput = tensors[outId];
                if (producerGroup.opType && producerGroup.opType.toLowerCase() === 'linear') {
                     if (producerOutput && producerOutput.name) return producerOutput.name;
                     return 'y';
                }
                if (producerOutput && producerOutput.name) return producerOutput.name;
            }
            return tensor.id;
        };

        var inputCards = [];
        if (safeInputs[0]) {
            var inputLabel = getInputDisplayName(safeInputs[0]);
            var inputCard = createMatrixCard(inputLabel, safeInputs[0], 'auto', 'input');
            grid.appendChild(inputCard);
            inputCards.push(inputCard);
        }

        var outputCard = createMatrixCard(getName(safeOutput, type), safeOutput, outputOrientation, 'output');
        grid.appendChild(outputCard);

        if (type === 'transpose' && inputCards.length > 0) {
            setupTransposeHover(inputCards[0], outputCard);
        } else if (reductions.indexOf(type) !== -1 && inputCards.length > 0) {
            setupReductionHover(inputCards[0], outputCard);
        } else {
            var isElementwiseUnary = ['relu', 'sigmoid', 'tanh', 'gelu', 'softmax', 'logsoftmax', 'rmsnorm', 'sqrt'].indexOf(type) !== -1;
            if (isElementwiseUnary && inputCards.length > 0) {
                setupElementwiseHover(inputCards, outputCard);
            }
        }
        container.appendChild(grid);
        return;
    }

    else if (isMatmul) {

        var result = createMatrixCard('Loss', safeOutput, 'auto', 'output');

  // ==================== Hover Logics (Robust Visual) ====================
  function setupReductionHover(inputCard, outputCard) {
    var outTable = outputCard.querySelector('.matrix-table');
    var inTable = inputCard.querySelector('.matrix-table');
    if (!outTable || !inTable) return;

    function getVisualShape(table) {
        var rows = table.querySelectorAll('tr').length;
        var firstRow = table.querySelector('tr');
        var cols = firstRow ? firstRow.querySelectorAll('td[data-col]').length : 1;
        return { rows: rows, cols: cols };
    }

    var inShape = getVisualShape(inTable);
    var outShape = getVisualShape(outTable);
    var cells = outTable.querySelectorAll('td[data-row][data-col]');

    for(var i=0; i<cells.length; i++) {
        (function(cell){
            cell.style.cursor = 'pointer';
            cell.addEventListener('mouseenter', function() {
                var r = parseInt(cell.dataset.row);
                var c = parseInt(cell.dataset.col);
                cell.classList.add('highlight-cell');

                // Visual shape comparison handles squeezing logic automatically
                if (inShape.rows > outShape.rows && inShape.cols === outShape.cols) {
                    var targets = inTable.querySelectorAll('td[data-col="' + c + '"]');
                    for(var k=0; k<targets.length; k++) targets[k].classList.add('highlight-col');
                }
                else if (inShape.cols > outShape.cols && inShape.rows === outShape.rows) {
                    var targets = inTable.querySelectorAll('td[data-row="' + r + '"]');
                    for(var k=0; k<targets.length; k++) targets[k].classList.add('highlight-row');
                }
                else if (inShape.rows === outShape.rows && inShape.cols === outShape.cols) {
                    var target = inTable.querySelector('td[data-row="' + r + '"][data-col="' + c + '"]');
                    if (target) target.classList.add('highlight-cell');
                }
                else {
                    var all = inTable.querySelectorAll('td');
                    for(var k=0; k<all.length; k++) all[k].classList.add('highlight-cell');
                }
            });
            cell.addEventListener('mouseleave', function() {
                cell.classList.remove('highlight-cell');
                var all = inTable.querySelectorAll('.highlight-row, .highlight-col, .highlight-cell');
                for(var k=0; k<all.length; k++) {
                    all[k].classList.remove('highlight-row');
                    all[k].classList.remove('highlight-col');
                    all[k].classList.remove('highlight-cell');
                }
            });
        })(cells[i]);
    }
  }

  function setupElementwiseHover(inputCards, outputCard) {
    var outTable = outputCard.querySelector('.matrix-table');
    if (!outTable) return;
    var inputTables = [];
    for(var i=0; i<inputCards.length; i++) {
        var t = inputCards[i].querySelector('.matrix-table');
        if (t) inputTables.push(t);
    }
    if (inputTables.length === 0) return;

    function getDims(table) {
        var rows = table.querySelectorAll('tr').length;
        var firstRow = table.querySelector('tr');
        var cols = firstRow ? firstRow.querySelectorAll('td[data-col]').length : 1;
        return { rows: rows, cols: cols };
    }
    var outCells = outTable.querySelectorAll('td[data-row][data-col]');

    for(var i=0; i<outCells.length; i++) {
        (function(cell){
            cell.style.cursor = 'pointer';
            cell.addEventListener('mouseenter', function() {
                var r = parseInt(cell.dataset.row);
                var c = parseInt(cell.dataset.col);
                cell.classList.add('highlight-cell');

                for(var j=0; j<inputTables.length; j++) {
                    var inTable = inputTables[j];
                    var dims = getDims(inTable);
                    var inR = r, inC = c;
                    // Broadcasting Modulo Logic
                    if (dims.rows === 1) inR = 0; else if (r >= dims.rows) inR = r % dims.rows;
                    if (dims.cols === 1) inC = 0; else if (c >= dims.cols) inC = c % dims.cols;

                    var target = inTable.querySelector('td[data-row="' + inR + '"][data-col="' + inC + '"]');
                    if (target) target.classList.add('highlight-cell');
                }
            });
            cell.addEventListener('mouseleave', function() {
                cell.classList.remove('highlight-cell');
                for(var j=0; j<inputTables.length; j++) {
                    var els = inputTables[j].querySelectorAll('.highlight-cell');
                    for(var k=0; k<els.length; k++) els[k].classList.remove('highlight-cell');
                }
            });
        })(outCells[i]);
    }
  }

  function setupMatmulHover(wrapper, leftCard, topCard, resultCard) {
    var resTable = resultCard.querySelector('.matrix-table');
    if (!resTable) return;
    var leftTable = leftCard ? leftCard.querySelector('.matrix-table') : null;
    var topTable = topCard ? topCard.querySelector('.matrix-table') : null;

    var cells = resTable.querySelectorAll('td[data-row][data-col]');
    for(var i=0; i<cells.length; i++) {
        (function(cell){
            cell.style.cursor = 'pointer';
            cell.addEventListener('mouseenter', function() {
                var r = cell.dataset.row;
                var c = cell.dataset.col;
                cell.classList.add('highlight-cell');
                if (leftTable) {
                    var rows = leftTable.querySelectorAll('td[data-row="' + r + '"]');
                    for(var k=0; k<rows.length; k++) rows[k].classList.add('highlight-row');
                }
                if (topTable) {
                    var cols = topTable.querySelectorAll('td[data-col="' + c + '"]');
                    for(var k=0; k<cols.length; k++) cols[k].classList.add('highlight-col');
                }
            });
            cell.addEventListener('mouseleave', function() {
                cell.classList.remove('highlight-cell');
                if (leftTable) {
                    var rows = leftTable.querySelectorAll('.highlight-row');
                    for(var k=0; k<rows.length; k++) rows[k].classList.remove('highlight-row');
                }
                if (topTable) {
                    var cols = topTable.querySelectorAll('.highlight-col');
                    for(var k=0; k<cols.length; k++) cols[k].classList.remove('highlight-col');
                }
            });

  }

  function setupTransposeHover(inputCard, outputCard) {
    var outTable = outputCard.querySelector('.matrix-table');
    var inTable = inputCard.querySelector('.matrix-table');
    if (!outTable || !inTable) return;
    var cells = outTable.querySelectorAll('td[data-row][data-col]');

                var els = inTable.querySelectorAll('.highlight-cell');
                for(var k=0; k<els.length; k++) els[k].classList.remove('highlight-cell');
            });
        })(cells[i]);
    }
  }

  // ==================== Layout & Standard Functions ====================

  function renderFirstPass() {
    var canvas = document.getElementById('canvas');
    canvas.innerHTML = '';
    canvas.appendChild(createToolbar());

    var content = document.createElement('div');
    content.id = 'canvas-content';
    canvas.appendChild(content);

    var groupElById = {};

    function getGroupLabel(g) {
      function getOrPlaceholder(id) {
        if (tensors[id]) return tensors[id];
        return { id: id, shape: [], data: [], name: id };
      }
      var output = getOrPlaceholder(g.outputId);
      var inputs = (g.inputIds || []).map(function(id){ return getOrPlaceholder(id); });
      var outputName = output.name || g.opType;

      if (g.opType.toLowerCase() === 'linear' && inputs.length >= 2) {
        var originalInput = inputs[1];
        var inputName = originalInput.name || originalInput.id || 'x';
        return outputName + ' = Linear(' + inputName + ')';
      }

      var inputNames = inputs.map(function(t){ return t.name || t.id; }).join(', ');
      return outputName + ' = ' + g.opType + '(' + inputNames + ')';
    }

    function getGroupOp(g) {
      function getOrPlaceholder(id) {
        if (tensors[id]) return tensors[id];
        return { id: id, shape: [], data: [], name: id };
      }
      var output = getOrPlaceholder(g.outputId);
      var inputs = (g.inputIds || []).map(function(id){ return getOrPlaceholder(id); });
      return { type: g.opType, inputs: inputs, output: output, meta: g.meta || {} };
    }

    groups.forEach(function(g) {
      var el = document.createElement('div');
      el.className = 'group-container';
      el.dataset.groupId = g.id;
      el.style.left = '0px'; el.style.top = '0px'; el.style.visibility = 'hidden';

      var label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = getGroupLabel(g);
      el.appendChild(label);

      renderOp(el, getGroupOp(g));
      content.appendChild(el);
      groupElById[g.id] = el;
    });

    content.offsetHeight; // Force layout

    if (skipLayout) {
        var MIN_Y = 80;
        var minLoadedY = Infinity;
        groups.forEach(function(g){ if(typeof g.y === 'number') minLoadedY = Math.min(minLoadedY, g.y); });
        var yOffset = (minLoadedY < MIN_Y && minLoadedY !== Infinity) ? (MIN_Y - minLoadedY) : 0;
        groups.forEach(function(g) {
            var el = groupElById[g.id];
            if (el) {
                var xPos = typeof g.x === 'number' ? g.x : 0;
                var yPos = (typeof g.y === 'number' ? g.y : 0) + yOffset;
                el.style.left = xPos + 'px'; el.style.top = yPos + 'px';
                g.x = xPos; g.y = yPos;
            }
        });
        boxes.forEach(function(box){
             if(typeof box.x !== 'number') box.x = 0;
             if(typeof box.y !== 'number') box.y = 0; else box.y += yOffset;
             if(!box.w || box.w<=0) box.w=100; if(!box.h || box.h<=0) box.h=100;
        });
        skipLayout = false;
    } else {
        createPendingBoxes(groupElById);
    }

    groups.forEach(function(g){
        var el = groupElById[g.id];
        if(el) { el.style.visibility='visible'; el.style.left=g.x+'px'; el.style.top=g.y+'px'; }
    });

    renderFinal(groupElById);
  }

  function createPendingBoxes(groupElById) {
      var PAD=20, LABEL_H=24, LEFT_MARGIN=80;
      var layoutCursorY = 100;
      var orphanGroupIds = groups.map(function(g){return g.id;});
      if (orphanGroupIds.length > 0) {
          layoutGroupsTwoColumns(orphanGroupIds, groupElById, layoutCursorY, LEFT_MARGIN);
      }
  }

  function layoutGroupsTwoColumns(groupIds, groupElById, startY, leftMargin) {
      var COL_GAP=80, ROW_GAP=50;
      var nLeft = Math.ceil(groupIds.length / 2);
      var leftIds = groupIds.slice(0, nLeft);
      var rightIds = groupIds.slice(nLeft);

      var yL = startY;
      leftIds.forEach(function(id){
          var g = groups.find(function(gr){return gr.id===id;});
          var el = groupElById[id];
          if(g && el) {
              g.x = leftMargin; g.y = yL;
              el.style.left = g.x+'px'; el.style.top = g.y+'px';
              yL += el.offsetHeight + ROW_GAP;
          }
      });

      var yR = startY;
      var maxLeftW = 300;
      var rightX = leftMargin + maxLeftW + COL_GAP;

      rightIds.forEach(function(id){
          var g = groups.find(function(gr){return gr.id===id;});
          var el = groupElById[id];
          if(g && el) {
              g.x = rightX; g.y = yR;
              el.style.left = g.x+'px'; el.style.top = g.y+'px';
              yR += el.offsetHeight + ROW_GAP;
          }
      });
  }

  // Toolbar

    function addBtn(label, onClick, isTool, toolName) {

  function renderFinal(groupElById) {
    var content = document.getElementById('canvas-content');

    // Boxes
    boxes.forEach(function(box) {
        var colors = { border:'rgba(56,189,248,0.9)', bg:'rgba(15,23,42,0.45)', label:'#7dd3fc' };
        var el = document.createElement('div');
        el.className = 'layer-box';
        el.style.left = box.x+'px'; el.style.top = box.y+'px';
        el.style.width = box.w+'px'; el.style.height = box.h+'px';
        el.style.borderColor = colors.border; el.style.background = colors.bg;

        if (selectedBoxIds.has(box.id)) el.classList.add('layer-box-selected');

        var lbl = document.createElement('div');
        lbl.className = 'layer-box-label';
        lbl.textContent = box.label;
        lbl.style.color = colors.label;
        el.appendChild(lbl);

        lbl.onmousedown = function(e) {
            e.preventDefault(); e.stopPropagation();
            selectedBoxIds.clear(); selectedBoxIds.add(box.id);
            el.classList.add('layer-box-selected');
            var startX = e.clientX, startY = e.clientY;
            var origX = box.x, origY = box.y;
            // Simplified box move logic
            function onMove(ev) {
                box.x = origX + (ev.clientX - startX)/zoomLevel;
                box.y = origY + (ev.clientY - startY)/zoomLevel;
                el.style.left = box.x+'px'; el.style.top = box.y+'px';
            }
            function onUp() { window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); }
            window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        };

        content.insertBefore(el, content.firstChild);
    });

    // Drag logic for groups
    groups.forEach(function(g){
        var el = groupElById[g.id];
        if(!el) return;
        var labelEl = el.querySelector('.group-label');
        if(labelEl) {
            labelEl.onmousedown = function(e) {
                e.preventDefault(); e.stopPropagation();
                if(currentTool === 'select') {
                    if(!e.ctrlKey) selectedGroupIds.clear();
                    selectedGroupIds.add(g.id);
                    el.classList.add('group-selected');
                }
                var startX = e.clientX, startY = e.clientY;
                var origX = g.x, origY = g.y;
                function onMove(ev) {
                    g.x = origX + (ev.clientX - startX)/zoomLevel;
                    g.y = origY + (ev.clientY - startY)/zoomLevel;
                    el.style.left = g.x+'px'; el.style.top = g.y+'px';
                }
                function onUp() { window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); }
                window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
            };
        }
        if(selectedGroupIds.has(g.id)) el.classList.add('group-selected');
    });

    // Notes
    canvasNotes.forEach(function(note){
        var el = document.createElement('div');
        el.className = 'note-container';
        el.style.left = note.x+'px'; el.style.top = note.y+'px';
        var header = document.createElement('div'); header.className = 'note-header'; header.textContent = 'NOTE';
        el.appendChild(header);
        var body = document.createElement('div'); body.className = 'note-body';
        body.innerHTML = window.marked ? marked.parse(note.text) : note.text;
        el.appendChild(body);

        header.onmousedown = function(e) {
            e.preventDefault(); e.stopPropagation();
            var startX = e.clientX, startY = e.clientY;
            var origX = note.x, origY = note.y;
            function onMove(ev) {
                note.x = origX + (ev.clientX - startX)/zoomLevel;
                note.y = origY + (ev.clientY - startY)/zoomLevel;
                el.style.left = note.x+'px'; el.style.top = note.y+'px';
            }
            function onUp() { window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); }
            window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        };
        el.ondblclick = function() { openNoteModal(note); };
        content.appendChild(el);
    });

    applyZoom();
  }

  function render() { renderFirstPass(); }
  function applyZoom() {
      var c = document.getElementById('canvas-content');
      if(c) c.style.transform = 'scale(' + zoomLevel + ')';
  }

  function addNote() { canvasNotes.push({ id:'n'+Date.now(), x:100, y:100, text:'New note' }); render(); }
  var editingNote = null;
  function openNoteModal(note) {
      editingNote = note;
      document.getElementById('note-modal-textarea').value = note.text;
      document.getElementById('note-modal-backdrop').classList.add('show');
  }
  document.getElementById('note-modal-cancel').onclick = function(){ document.getElementById('note-modal-backdrop').classList.remove('show'); };
  document.getElementById('note-modal-save').onclick = function(){
      if(editingNote) editingNote.text = document.getElementById('note-modal-textarea').value;
      document.getElementById('note-modal-backdrop').classList.remove('show');
      render();
  };
  document.getElementById('note-modal-delete').onclick = function(){
      if(editingNote) {
          var idx = -1; for(var i=0; i<canvasNotes.length; i++) if(canvasNotes[i].id===editingNote.id) idx=i;
          if(idx>=0) canvasNotes.splice(idx,1);
      }
      document.getElementById('note-modal-backdrop').classList.remove('show');
      render();
  };

  // Box Creation (restored)
  function createBoxFromSelection() {
      if(selectedGroupIds.size === 0) { alert('Select groups first to create a box.'); return; }
      var label = prompt('Box Label:', 'Layer ' + (boxes.length+1));
      if(!label) return;

      // Compute bounds
      var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      var groupIdsArr = [];
      selectedGroupIds.forEach(function(gid){
          groupIdsArr.push(gid);
          var g = groups.find(function(gr){return gr.id===gid;});
          if(g) { minX=Math.min(minX,g.x); minY=Math.min(minY,g.y); maxX=Math.max(maxX,g.x+200); maxY=Math.max(maxY,g.y+150); }
      });

      boxes.push({
          id:'b'+nextBoxId++,
          label: label,
          x: minX - 20, y: minY - 40,
          w: (maxX-minX) + 40, h: (maxY-minY) + 60,
          groupIds: groupIdsArr
      });
      selectedGroupIds.clear();
      render();
  }

      var state = {
          code: document.getElementById('code').value,
          groups: groups, boxes: boxes, tensors: tensors, notes: canvasNotes
      };
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });

      a.href = URL.createObjectURL(blob);
      a.download = 'tinytorch-dump.json';
      a.click();
  }

  // WebSocket
  function connectWebSocket() {
    document.getElementById('wsStatus').className = 'status-indicator connecting';
    ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');
    ws.onopen = function() { wsConnected = true; document.getElementById('wsStatus').className = 'status-indicator'; document.getElementById('run').disabled = false; };
    ws.onclose = function() { wsConnected = false; document.getElementById('wsStatus').className = 'status-indicator disconnected'; document.getElementById('run').disabled = true; setTimeout(connectWebSocket, 2000); };
    ws.onmessage = function(e) { try { handleMessage(JSON.parse(e.data)); } catch(err) { console.error(err); } };
  }

  function handleMessage(msg) {
      if(msg.event === 'reset') {
          tensors = {}; groups = []; pendingBoxes = []; boxes = []; nextGroupId = 1;
          document.getElementById('console-output').innerHTML = '';
      } else if(msg.event === 'tensor') {
          tensors[msg.id] = { id:msg.id, shape:msg.shape, data:msg.data, name:msg.name };
      } else if(msg.event === 'op') {
          groups.push({ id:'g'+nextGroupId++, opType:msg.type, inputIds:msg.inputs, outputId:msg.output, meta:msg.meta||{}, x:0, y:0 });
      } else if(msg.event === 'done') {
          render();
      } else if(msg.event === 'print') {
          var div = document.createElement('div'); div.className='console-line'; div.textContent=msg.text;
          document.getElementById('console-output').appendChild(div);
      }
  }

  function runCode() {
    if (!wsConnected) return;
    ws.send(JSON.stringify({ action: 'run', code: document.getElementById('code').value }));
  }
  document.getElementById('run').onclick = runCode;

  // PDF
  async function autoLoadMathPDF() {
    if (!window.pdfjsLib) { setTimeout(autoLoadMathPDF, 200); return; }
    try {
      var response = await fetch('static/math.pdf');
      if (!response.ok) response = await fetch('math.pdf');
      if (!response.ok) return;
      var blob = await response.blob();
      var url = URL.createObjectURL(blob);
      var loadingTask = pdfjsLib.getDocument(url);
      loadingTask.promise.then(function(doc) {
        pdfDoc = doc; renderPdfPage(1);
      });
    } catch (err) {}
  }

  var pdfDoc = null;
  function renderPdfPage(num) {
      if(!pdfDoc) return;
      pdfDoc.getPage(num).then(function(page){
          var cvs = document.getElementById('pdfCanvas');
          var viewport = page.getViewport({ scale: 1.0 });
          cvs.width = viewport.width; cvs.height = viewport.height;
          page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport });
          cvs.style.display = 'block'; document.getElementById('pdfPlaceholder').style.display='none';
      });
  }

  // Restore retro mode
  if (localStorage.getItem('retroMode') === '1') document.body.classList.add('retro-mode');
  connectWebSocket();
  autoLoadMathPDF();

</script>
</body>
</html>
